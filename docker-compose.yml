services:
  vinylflow:
    build: .
    container_name: vinylflow
    ports:
      # Localhost only by default; set BIND_ADDRESS=0.0.0.0 in .env for LAN access (no auth!)
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      - VINYLFLOW_ALLOWED_HOSTS=${VINYLFLOW_ALLOWED_HOSTS:-}
      # Discogs API Configuration
      - DISCOGS_USER_TOKEN=${DISCOGS_USER_TOKEN}
      - DISCOGS_USER_AGENT=${DISCOGS_USER_AGENT:-VinylFlow/1.0}

      # Audio Processing Settings
      - DEFAULT_SILENCE_THRESHOLD=${DEFAULT_SILENCE_THRESHOLD:--40}
      - DEFAULT_MIN_SILENCE_DURATION=${DEFAULT_MIN_SILENCE_DURATION:-1.0}
      - DEFAULT_MIN_TRACK_LENGTH=${DEFAULT_MIN_TRACK_LENGTH:-30}
      - DEFAULT_FLAC_COMPRESSION=${DEFAULT_FLAC_COMPRESSION:-8}

      # Output Configuration
      - DEFAULT_OUTPUT_DIR=/app/output

      # Import folder: recordings placed here are read in place (no browser upload)
      - VINYLFLOW_IMPORT_DIR=/app/incoming

      # Server Configuration
      # Internal port is always 8000. Change PORT in .env to map a different external port.
      - PORT=8000
    volumes:
      # Persistent storage for processed files
      - ./output:/app/output
      # Import folder (read-only: VinylFlow never modifies or deletes your recordings).
      # Set IMPORT_FOLDER in .env to use an existing folder of recordings.
      - ${IMPORT_FOLDER:-./incoming}:/app/incoming:ro
      # Temporary uploads (can be ephemeral)
      - ./temp_uploads:/app/temp_uploads
      # Config storage for settings.json (PERSISTENT)
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/queue', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vinylflow-network

networks:
  vinylflow-network:
    driver: bridge
